<!doctype html>
<html lang="az">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>3D Futbol</title>
  <meta name="description" content="3D Futbol - Online multiplayer futbol oyunu" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.165.0/build/three.module.js"
      }
    }
  </script>
  <style>
    :root {
      --bg1: #0b1d2a;
      --bg2: #174a66;
      --panel: rgba(9, 20, 30, 0.88);
      --panel-hover: rgba(15, 30, 45, 0.92);
      --line: rgba(255, 255, 255, 0.1);
      --text: #f4f7fb;
      --text-dim: rgba(244, 247, 251, 0.6);
      --accent: #ffb200;
      --accent-glow: rgba(255, 178, 0, 0.3);
      --green: #49d17d;
      --green-dim: rgba(73, 209, 125, 0.2);
      --red: #ff5a5a;
      --blue: #4e8dff;
      --blue-dim: rgba(78, 141, 255, 0.2);
      --purple: #a855f7;
      --purple-dim: rgba(168, 85, 247, 0.2);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      font-family: 'Inter', 'Segoe UI', Tahoma, sans-serif;
      color: var(--text);
    }

    body {
      overflow: hidden;
      background: radial-gradient(circle at 15% 15%, #21658d 0%, var(--bg1) 40%),
        linear-gradient(140deg, var(--bg1), var(--bg2));
    }

    #app {
      position: fixed;
      inset: 0;
    }

    /* ========= HUD ========= */
    #hud {
      position: fixed;
      left: 16px;
      bottom: 16px;
      width: min(360px, calc(100vw - 32px));
      display: none;
      gap: 10px;
      z-index: 30;
    }

    #statusHud {
      position: fixed;
      top: 16px;
      right: 16px;
      display: none;
      gap: 8px;
      z-index: 31;
      width: min(330px, calc(100vw - 32px));
    }

    .hud-block {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 10px;
      backdrop-filter: blur(10px);
    }

    .bar-wrap {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .bar-label {
      font-size: 13px;
      opacity: 0.9;
      font-weight: 600;
    }

    .bar {
      width: 100%;
      height: 12px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.08);
      overflow: hidden;
      border: 1px solid var(--line);
    }

    .bar-fill {
      height: 100%;
      width: 0%;
      transition: width 40ms linear;
    }

    #sprintFill {
      background: linear-gradient(90deg, #49d17d, #8af0b2);
    }

    #powerFill {
      background: linear-gradient(90deg, #ffd24a, #ff8d2d);
    }

    .status-line {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      font-size: 13px;
      margin-bottom: 6px;
      opacity: 0.95;
    }

    /* ========= MENU ROOT ========= */
    #menuRoot {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      z-index: 40;
      padding: 20px;
      background: rgba(0, 0, 0, 0.35);
      backdrop-filter: blur(4px);
    }

    /* ========= MENU PANELS ========= */
    .menu {
      width: min(520px, 100%);
    }

    .menu.sub-menu {
      width: min(600px, 100%);
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 28px;
      backdrop-filter: blur(14px);
      box-shadow: 0 8px 40px rgba(0, 0, 0, 0.4);
    }

    .main-panel {
      text-align: center;
    }

    .sub-panel {
      position: relative;
    }

    /* ========= TITLES ========= */
    .game-title {
      font-size: 36px;
      font-weight: 800;
      background: linear-gradient(135deg, #ffcc4d, #ffa31f, #ff8d2d);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 6px;
      letter-spacing: -0.5px;
    }

    .greeting {
      font-size: 14px;
      color: var(--text-dim);
      margin-bottom: 20px;
    }

    .greeting strong {
      color: var(--accent);
    }

    h1 {
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 16px;
    }

    h2 {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 10px;
      color: var(--text-dim);
    }

    /* ========= MAIN BUTTONS ========= */
    .main-buttons {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 16px;
    }

    .menu-btn {
      display: flex;
      align-items: center;
      gap: 12px;
      width: 100%;
      padding: 14px 20px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--line);
      border-radius: 12px;
      color: var(--text);
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      font-family: inherit;
    }

    .menu-btn:hover {
      background: rgba(255, 255, 255, 0.1);
      border-color: rgba(255, 255, 255, 0.2);
      transform: translateY(-1px);
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.2);
    }

    .menu-btn:active {
      transform: translateY(0);
    }

    .btn-icon {
      font-size: 22px;
      flex-shrink: 0;
    }

    .btn-text {
      flex: 1;
      text-align: left;
    }

    .play-btn {
      background: linear-gradient(135deg, rgba(255, 178, 0, 0.15), rgba(255, 141, 45, 0.1));
      border-color: rgba(255, 178, 0, 0.3);
    }

    .play-btn:hover {
      background: linear-gradient(135deg, rgba(255, 178, 0, 0.25), rgba(255, 141, 45, 0.18));
      border-color: var(--accent);
      box-shadow: 0 4px 20px var(--accent-glow);
    }

    .training-btn {
      background: var(--green-dim);
      border-color: rgba(73, 209, 125, 0.3);
    }

    .training-btn:hover {
      background: rgba(73, 209, 125, 0.3);
      border-color: var(--green);
      box-shadow: 0 4px 20px rgba(73, 209, 125, 0.2);
    }

    .settings-btn {
      background: var(--blue-dim);
      border-color: rgba(78, 141, 255, 0.3);
    }

    .settings-btn:hover {
      background: rgba(78, 141, 255, 0.3);
      border-color: var(--blue);
      box-shadow: 0 4px 20px rgba(78, 141, 255, 0.2);
    }

    .account-btn {
      background: var(--purple-dim);
      border-color: rgba(168, 85, 247, 0.3);
    }

    .account-btn:hover {
      background: rgba(168, 85, 247, 0.3);
      border-color: var(--purple);
      box-shadow: 0 4px 20px rgba(168, 85, 247, 0.2);
    }

    .nickname-btn {
      background: rgba(255, 255, 255, 0.04);
      border-color: var(--line);
    }

    .nickname-btn:hover {
      background: rgba(255, 255, 255, 0.08);
      border-color: rgba(255, 255, 255, 0.2);
    }

    /* ========= BACK BUTTON ========= */
    .back-btn {
      position: absolute;
      top: 16px;
      right: 16px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--line);
      border-radius: 8px;
      color: var(--text-dim);
      font-size: 13px;
      font-weight: 600;
      padding: 6px 14px;
      cursor: pointer;
      transition: all 0.2s;
      font-family: inherit;
    }

    .back-btn:hover {
      background: rgba(255, 255, 255, 0.12);
      color: var(--text);
    }

    /* ========= FORMS ========= */
    .row {
      display: flex;
      gap: 10px;
      align-items: center;
      margin-bottom: 10px;
    }

    .row label {
      min-width: 110px;
      font-size: 14px;
      color: var(--text-dim);
      font-weight: 500;
    }

    input,
    select {
      background: rgba(255, 255, 255, 0.06);
      color: var(--text);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 9px 12px;
      font-size: 14px;
      font-family: inherit;
      transition: border-color 0.2s;
      flex: 1;
    }

    input:focus,
    select:focus {
      outline: none;
      border-color: var(--accent);
      background: rgba(255, 255, 255, 0.08);
    }

    input[type="range"] {
      -webkit-appearance: none;
      appearance: none;
      height: 6px;
      border-radius: 3px;
      background: rgba(255, 255, 255, 0.1);
      border: none;
      padding: 0;
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: var(--accent);
      cursor: pointer;
      border: 2px solid rgba(0, 0, 0, 0.3);
    }

    .range-val {
      font-size: 13px;
      min-width: 40px;
      text-align: right;
      color: var(--accent);
      font-weight: 600;
    }

    /* ========= PLAY PAGE ========= */
    .play-options {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 16px;
    }

    .play-card {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 16px;
    }

    .play-card h2 {
      margin-bottom: 4px;
      color: var(--text);
      font-size: 15px;
    }

    .play-card p {
      font-size: 12px;
      color: var(--text-dim);
      margin-bottom: 12px;
    }

    .room-info {
      margin-top: 8px;
      font-size: 13px;
      min-height: 18px;
      color: var(--accent);
      font-weight: 500;
    }

    .avatar-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 4px 16px;
    }

    /* ========= SETTINGS PAGE ========= */
    .settings-tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 18px;
    }

    .tab-btn {
      flex: 1;
      padding: 10px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--line);
      border-radius: 10px;
      color: var(--text-dim);
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      font-family: inherit;
    }

    .tab-btn.active {
      background: rgba(78, 141, 255, 0.15);
      border-color: var(--blue);
      color: var(--text);
    }

    .tab-btn:hover {
      background: rgba(255, 255, 255, 0.08);
    }

    .controls-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .ctrl-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 12px;
      background: rgba(255, 255, 255, 0.03);
      border-radius: 8px;
      font-size: 13px;
    }

    kbd {
      display: inline-block;
      padding: 3px 8px;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid var(--line);
      border-radius: 5px;
      font-size: 12px;
      font-weight: 700;
      font-family: inherit;
      min-width: 32px;
      text-align: center;
      white-space: nowrap;
    }

    .ctrl-item span:last-child {
      color: var(--text-dim);
      font-size: 12px;
    }

    /* ========= ACCOUNT PAGE ========= */
    .auth-desc {
      font-size: 14px;
      color: var(--text-dim);
      margin-bottom: 18px;
    }

    .auth-form {
      max-width: 400px;
      margin: 0 auto;
    }

    .auth-error {
      color: var(--red);
      font-size: 13px;
      min-height: 20px;
      margin: 6px 0;
      font-weight: 500;
    }

    .auth-buttons {
      display: flex;
      gap: 10px;
      margin-top: 8px;
    }

    .account-card {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 18px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--line);
      border-radius: 12px;
    }

    .account-avatar {
      font-size: 40px;
      width: 60px;
      height: 60px;
      display: grid;
      place-items: center;
      background: var(--purple-dim);
      border-radius: 50%;
    }

    .account-email {
      font-size: 15px;
      font-weight: 600;
    }

    .account-nick {
      font-size: 13px;
      color: var(--text-dim);
      margin-top: 4px;
    }

    .account-nick strong {
      color: var(--accent);
    }

    /* ========= NICKNAME PAGE ========= */
    .nick-desc {
      font-size: 14px;
      color: var(--text-dim);
      margin-bottom: 18px;
    }

    .nick-form {
      max-width: 400px;
      margin: 0 auto;
    }

    .nick-form input {
      width: 100%;
      padding: 14px 16px;
      font-size: 18px;
      text-align: center;
      letter-spacing: 1px;
    }

    .nick-rules {
      display: flex;
      gap: 16px;
      justify-content: center;
      margin-top: 8px;
      font-size: 12px;
      color: var(--text-dim);
    }

    /* ========= REMATCH OVERLAY ========= */
    #rematchOverlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.85);
      z-index: 2000;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      font-family: inherit;
      backdrop-filter: blur(6px);
    }

    #rematchOverlay h1 {
      font-size: 48px;
      margin-bottom: 20px;
      text-shadow: 0 0 20px var(--accent);
    }

    #rematchOverlay .actions {
      display: flex;
      gap: 12px;
    }

    #rematchBtn {
      padding: 15px 40px;
      font-size: 18px;
      background: linear-gradient(135deg, #ffcc4d, #ffa31f);
      border: none;
      border-radius: 12px;
      cursor: pointer;
      font-weight: 700;
      color: #1a1200;
      font-family: inherit;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    #rematchBtn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px var(--accent-glow);
    }

    #exitToMenuBtn {
      padding: 15px 40px;
      font-size: 18px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--line);
      border-radius: 12px;
      cursor: pointer;
      font-weight: 700;
      color: white;
      font-family: inherit;
      transition: all 0.2s;
    }

    #exitToMenuBtn:hover {
      background: rgba(255, 255, 255, 0.12);
    }

    /* ========= RESPONSIVE ========= */
    @media (max-width: 600px) {
      .play-options {
        grid-template-columns: 1fr;
      }

      .controls-grid {
        grid-template-columns: 1fr;
      }

      .avatar-grid {
        grid-template-columns: 1fr;
      }

      .panel {
        padding: 18px;
      }

      .game-title {
        font-size: 28px;
      }
    }

    /* ========= ANIMATIONS ========= */
    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(10px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .panel {
      animation: fadeIn 0.3s ease-out;
    }
  </style>
</head>

<body>
  <div id="app"></div>

  <div id="hud">
    <div class="hud-block bar-wrap">
      <div class="bar-label">Sprint</div>
      <div class="bar">
        <div id="sprintFill" class="bar-fill"></div>
      </div>
    </div>
    <div id="powerWrap" class="hud-block bar-wrap" style="display:none;">
      <div class="bar-label" id="powerLabel">Guc</div>
      <div class="bar">
        <div id="powerFill" class="bar-fill"></div>
      </div>
    </div>
    <div id="falsoWrap" class="hud-block bar-wrap" style="display:none;">
      <div class="bar-label">Falso</div>
      <div class="bar">
        <div id="falsoFill" class="bar-fill" style="background: linear-gradient(90deg, #ffcc00, #ff8800);"></div>
      </div>
    </div>
  </div>

  <div id="statusHud">
    <div class="hud-block">
      <div class="status-line"><span>Rejim</span><strong id="modeValue">MENU</strong></div>
      <div class="status-line"><span>Kamera</span><strong id="cameraValue">Third Person</strong></div>
      <div class="status-line"><span>Taymer</span><strong id="timerValue">--:--</strong></div>
    </div>
  </div>

  <div id="rematchOverlay">
    <h1>Oyun Bitdi!</h1>
    <div class="actions">
      <button id="rematchBtn">Yenidən Oyna</button>
      <button id="exitToMenuBtn">Menyuya Qayıt</button>
    </div>
  </div>

  <div id="menuRoot"></div>

  <script type="module" src="./src/main.js"></script>
</body>

</html>
